[package]
name = "ai-hotkey"
version = "0.1.2"
description = "AI hotkey – označ text kdekoli, zmáčkni zkratku, nech AI pracovat"
authors = ["Ongy"]
license = "MIT"
repository = "https://github.com/Ondrej-Kopecky/ai-hotkey"
edition = "2021"

[lib]
name = "ai_hotkey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "net", "macros"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
arboard = "3"
enigo = "0.6"
anyhow = "1"
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
dirs = "6"
tauri-plugin-autostart = "2.5.1"
axum = "0.8"
keyring = "4"
regex = "1.13.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }
